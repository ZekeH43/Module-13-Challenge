name: Applicant model regression
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install model dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic model tests
        run: python -m unittest discover -s tests -v
      - name: Evaluate full historical dataset with dummy and logistic baselines
        run: python venture_funding.py --model baseline --output /tmp/baseline.json
      - name: Evaluate neural-network model on deterministic sample
        run: python venture_funding.py --model mlp --sample 1500 --output /tmp/mlp.json
